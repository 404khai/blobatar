name: Deploy blobatar.dev

# Push-to-main rather than tag-driven, unlike `release.yml`.
#
# That workflow is manual because an npm version cannot be unpublished after 72
# hours, so shipping one has to be an explicit act. A Worker has no such
# property: `wrangler rollback` puts the previous version back in seconds. The
# asymmetry in how they ship is the asymmetry in how reversible they are.
on:
  push:
    branches: [main]
    # Nothing else can change what this Worker serves. A README edit should not
    # redeploy the endpoint.
    paths:
      - "apps/site/**"
      - "packages/blobatar/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The gate. `ci.yml` runs on the PR, but a deploy triggered by
      # `workflow_dispatch` or a direct push to main has not necessarily seen
      # one, and this is the workflow that makes something public.
      - name: Site and endpoint tests
        run: bun --filter site test

      # Wrangler resolves `blobatar` through its `exports` map, which points at
      # built JS that is not in the repo. The site build then produces `dist`,
      # which the Worker uploads as its static assets — deploying without it
      # would publish a Worker with no site behind it.
      - name: Build
        run: |
          bun --filter blobatar build
          bun run build:site

      # A scoped API token, not a global key: Account → Workers Scripts → Edit,
      # restricted to the one account. Cloudflare has no OIDC trusted publisher
      # equivalent to npm's, so unlike `release.yml` this repo does hold a
      # long-lived credential — rotate it if the repo's collaborators change.
      - name: Deploy
        run: cd apps/site && bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
