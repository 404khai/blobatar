name: CI

on:
  pull_request:
  push:
    branches: [main]

# A force-push or a quick follow-up commit makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The smoke test runs under Node on purpose — see scripts/smoke.mjs.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # Through turbo rather than calling `tsc` directly, so this and
      # `bun run typecheck` in the package are the same command. The package
      # script is still the only place the `tsc` invocation is written down —
      # a local gate that is a subset of CI is a gate that goes green on code
      # CI rejects.
      - name: Typecheck
        run: bunx turbo run typecheck --filter=blobatar

      - name: Tests
        run: bunx turbo run test --filter=blobatar

      # The cross-adapter equivalence check lives in its own private package
      # because no single adapter can own it. It imports each adapter by
      # package name, so this builds them and resolves through their real
      # `exports` maps — the run that caught `@blobatar/react` shipping
      # `export{a as Blobatar}` with no `a`.
      - name: Adapter drift harness
        run: bunx turbo run test --filter=@blobatar/harness

      - name: Size budgets
        run: bunx turbo run size --filter=blobatar

      # `probe-compose.ts` warns and exits 0 when it finds no browser, so that a
      # local run without one is not a hard stop. In CI that would turn the only
      # check that can see a CSS-versus-geometry divergence into a silent pass,
      # so both engines are asserted present before it runs.
      - name: Assert both engines are on the runner
        run: |
          google-chrome --version
          firefox --version

      - name: Composition gate
        run: bunx turbo run probe --filter=@blobatar/harness

      - name: Build
        run: bunx turbo run build

      # Links the built package under Node, through its own `exports` map. This
      # is the step that catches a dist that is broken for everyone outside Bun.
      - name: Smoke the built package
        run: bunx turbo run smoke --filter=blobatar

      # Every publishable package, not just core — a broken `files` or
      # `exports` in an adapter should fail here rather than at publish.
      - name: Pack
        run: |
          npm pack --workspace blobatar --pack-destination /tmp
          npm pack --workspace @blobatar/react --pack-destination /tmp
          npm pack --workspace @blobatar/vue --pack-destination /tmp
          npm pack --workspace blobatar-codemod --pack-destination /tmp

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: /tmp/*blobatar*.tgz
          retention-days: 7

  apps:
    name: apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The apps resolve `blobatar/*` to source through tsconfig paths, so this
      # builds the library from source as a side effect — which is the point: it
      # is the check that an alias and the package's `exports` have not drifted
      # apart into two different libraries.
      - name: Build the site
        run: bun run build:site

      # `apps/api` is the exception to the alias above: it has no `blobatar/*`
      # paths, so anything reaching it resolves the library through `exports`
      # and needs a dist first. That is deliberate — it is the endpoint anyone
      # can deploy, and it should be tested against what they will install.
      #
      # It is built here rather than in the endpoint step because the site's
      # Worker imports the endpoint from `apps/api/src`, so the site's tests
      # cross into that unaliased resolution too.
      - name: Build the library
        run: bunx turbo run build --filter=blobatar

      - name: Site tests
        run: bunx turbo run test --filter=site

      - name: Endpoint tests, against the built package
        run: bunx turbo run test --filter=blobatar-api

      # Bundles `blobatar` the way a deploy does: through the workspace symlink
      # and therefore through the real `exports` map, not the tsconfig alias to
      # source that `build:site` above uses. Breaking an export path fails here
      # rather than in production.
      #
      # It also proves the asset directory exists and the routes parse, which is
      # everything about the deploy that can be checked without performing one.
      - name: Workers bundle against the published exports
        run: |
          cd apps/site && bunx wrangler deploy --dry-run --outdir /tmp/site-dry
          cd ../api && bunx wrangler deploy --dry-run --outdir /tmp/api-dry
