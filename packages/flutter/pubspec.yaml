name: blobatar
description: Deterministic geometric blobatars from any string, with a pure Dart core and static or animated Flutter widgets.
version: 0.1.0
homepage: https://blobatar.dev
repository: https://github.com/Alain00/blobatar
issue_tracker: https://github.com/Alain00/blobatar/issues
topics:
  - avatar
  - flutter
  - deterministic
  - generative-art
screenshots:
  - description: The Blobatar Studio example with appearance and motion controls.
    path: flutter_blobatar_studio.png

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  # Dart has no built-in Unicode normalization; the JS core normalizes seeds
  # with String.prototype.normalize("NFC") and the paste-a-name case depends on
  # decomposed and precomposed input hashing equally. See
  unorm_dart: ^0.3.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.1.1
  test: ^1.25.0
